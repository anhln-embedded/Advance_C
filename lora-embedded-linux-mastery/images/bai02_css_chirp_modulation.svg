<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: bold; fill: #38bdf8; text-anchor: middle; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .grid { stroke: #334155; stroke-width: 1; stroke-dasharray: 4,4; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #cbd5e1; }
      .chirp-line { stroke: #38bdf8; stroke-width: 3; fill: none; stroke-linecap: round; }
      .down-chirp { stroke: #f43f5e; stroke-width: 3; fill: none; stroke-linecap: round; }
      .data-chirp { stroke: #22c55e; stroke-width: 3; fill: none; stroke-linecap: round; }
      .wrap-line { stroke: #22c55e; stroke-width: 1.5; stroke-dasharray: 2,2; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" class="bg" rx="12" />

  <!-- PANEL 1: UP-CHIRP -->
  <g transform="translate(25, 20)">
    <rect width="265" height="320" class="card" />
    <text x="132" y="32" class="title">1. Raw Up-Chirp (Preamble)</text>
    <text x="132" y="48" class="sub">Tần số quét tuyến tính từ f_min lên f_max</text>

    <!-- Axes -->
    <line x1="45" y1="230" x2="235" y2="230" class="axis" />
    <line x1="45" y1="230" x2="45" y2="70" class="axis" />
    
    <!-- Grid -->
    <line x1="45" y1="75" x2="235" y2="75" class="grid" />
    <line x1="45" y1="150" x2="235" y2="150" class="grid" />
    <line x1="235" y1="75" x2="235" y2="230" class="grid" />

    <!-- Labels -->
    <text x="8" y="80" class="axis-label">f_max</text>
    <text x="12" y="153" class="axis-label">f_c</text>
    <text x="8" y="234" class="axis-label">f_min</text>
    <text x="40" y="248" class="axis-label">t = 0</text>
    <text x="215" y="248" class="axis-label">t = T_s</text>

    <!-- Up-chirp Slope -->
    <line x1="45" y1="230" x2="235" y2="75" class="chirp-line" />

    <text x="132" y="280" class="badge-text" fill="#38bdf8" text-anchor: middle>Biểu tượng tiền đạo (Preamble)</text>
    <text x="132" y="300" class="sub">Dùng đồng bộ thời gian và pha</text>
  </g>

  <!-- PANEL 2: DOWN-CHIRP -->
  <g transform="translate(315, 20)">
    <rect width="265" height="320" class="card" />
    <text x="132" y="32" class="title">2. Raw Down-Chirp (Sync)</text>
    <text x="132" y="48" class="sub">Tần số quét tuyến tính từ f_max xuống f_min</text>

    <!-- Axes -->
    <line x1="45" y1="230" x2="235" y2="230" class="axis" />
    <line x1="45" y1="230" x2="45" y2="70" class="axis" />

    <!-- Grid -->
    <line x1="45" y1="75" x2="235" y2="75" class="grid" />
    <line x1="45" y1="150" x2="235" y2="150" class="grid" />
    <line x1="235" y1="75" x2="235" y2="230" class="grid" />

    <!-- Labels -->
    <text x="8" y="80" class="axis-label">f_max</text>
    <text x="12" y="153" class="axis-label">f_c</text>
    <text x="8" y="234" class="axis-label">f_min</text>
    <text x="40" y="248" class="axis-label">t = 0</text>
    <text x="215" y="248" class="axis-label">t = T_s</text>

    <!-- Down-chirp Slope -->
    <line x1="45" y1="75" x2="235" y2="230" class="down-chirp" />

    <text x="132" y="280" class="badge-text" fill="#f43f5e" text-anchor: middle>Ký hiệu phân cách (Delimiter)</text>
    <text x="132" y="300" class="sub">Đánh dấu điểm kết thúc Preamble</text>
  </g>

  <!-- PANEL 3: MODULATED DATA CHIRP -->
  <g transform="translate(605, 20)">
    <rect width="270" height="320" class="card" />
    <text x="135" y="32" class="title">3. Modulated Data Symbol</text>
    <text x="135" y="48" class="sub">Điều chế dữ liệu bằng điểm nhảy tần (Phase Wrap)</text>

    <!-- Axes -->
    <line x1="45" y1="230" x2="235" y2="230" class="axis" />
    <line x1="45" y1="230" x2="45" y2="70" class="axis" />

    <!-- Grid -->
    <line x1="45" y1="75" x2="235" y2="75" class="grid" />
    <line x1="45" y1="150" x2="235" y2="150" class="grid" />
    <line x1="235" y1="75" x2="235" y2="230" class="grid" />

    <!-- Labels -->
    <text x="8" y="80" class="axis-label">f_max</text>
    <text x="12" y="153" class="axis-label">f_c</text>
    <text x="8" y="234" class="axis-label">f_min</text>
    <text x="40" y="248" class="axis-label">t = 0</text>
    <text x="215" y="248" class="axis-label">t = T_s</text>

    <!-- Segment 1: Starting at f_offset, sweeping up to f_max -->
    <line x1="45" y1="160" x2="140" y2="75" class="data-chirp" />

    <!-- Instantaneous Phase Wrap: vertical line down to f_min -->
    <line x1="140" y1="75" x2="140" y2="230" class="wrap-line" />

    <!-- Segment 2: Sweeping from f_min up to f_offset -->
    <line x1="140" y1="230" x2="235" y2="160" class="data-chirp" />

    <!-- Offset indicator -->
    <circle cx="45" cy="160" r="3" fill="#22c55e" />
    <text x="50" y="153" class="axis-label" fill="#22c55e">f_shift (Mã hóa SF bits)</text>

    <text x="135" y="280" class="badge-text" fill="#22c55e" text-anchor: middle>Bit Value = f(f_shift)</text>
    <text x="135" y="300" class="sub">Tương quan giải mã sâu dưới nhiễu</text>
  </g>
</svg>

